name: Dev_Deploy

on:
  push:
    branches: ["dev_deploy"]

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/urffin-juss/rwl_crm:${{ github.sha }} .

      - name: Push Docker Image
        run: docker push ghcr.io/urffin-juss/rwl_crm:${{ github.sha }}
