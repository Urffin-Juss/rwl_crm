name: Dev_Deploy

on:
  push:
    branches: ["dev_deploy"]

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/urffin-juss/rwl_crm:${{ github.sha }} .

      - name: Push Docker Image
        run: docker push ghcr.io/urffin-juss/rwl_crm:${{ github.sha }}

      - name: Prepare SSH
        run: |
          
          mkdir -p ~/.ssh
          
          chmod 700 ~/.ssh
          
          echo "${{ secrets.BASTION_SSH_KEY }}" > ~/.ssh/github_actions_bastion
          
          echo "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/github_actions_dev
          
          chmod 600 ~/.ssh/github_actions_bastion
          
          chmod 600 ~/.ssh/github_actions_dev
          
          cat > ~/.ssh/config <<EOF
          
          Host rwl-bastion
          
              HostName ${{ secrets.BASTION_HOST }}
          
              Port ${{ secrets.BASTION_PORT }}
          
              User ${{ secrets.BASTION_USER }}
          
              IdentityFile ~/.ssh/github_actions_bastion
          
              IdentitiesOnly yes
          
          Host rwl-dev
          
              HostName ${{ secrets.DEV_HOST }}
          
              Port ${{ secrets.DEV_PORT }}
          
              User ${{ secrets.DEV_USER }}
          
              IdentityFile ~/.ssh/github_actions_dev
          
              IdentitiesOnly yes
          
              ProxyJump rwl-bastion
          
          EOF
          
          chmod 600 ~/.ssh/config
          
          echo "[${{ secrets.BASTION_HOST }}]:${{ secrets.BASTION_PORT }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBI/PGxBXZP7zArDTKQPwd58E2/ANnXvsXgf61TqfGXA" > ~/.ssh/known_hosts
          
          echo "${{ secrets.DEV_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBnVi2TXGVUEBFbXaWnaZc6htfpOQL2EDeUAsjCNF/46" >> ~/.ssh/known_hosts
          
          chmod 644 ~/.ssh/known_hosts
          
      - name: Copy DEV deployment files
        run: |
          scp \
            docker-compose.yml \
            docker-compose.dev.yml \
            rwl-dev:/opt/rwl/deploy/  


      - name: Deploy to DEV with rollback
        run: |
          ssh rwl-dev 'bash -s' <<'REMOTE'

          set -e

          cd /opt/rwl/deploy

          CURRENT_IMAGE=$(docker inspect rwl_crm-web-1 --format '{{.Config.Image}}')
          NEW_IMAGE="ghcr.io/urffin-juss/rwl_crm:${{ github.sha }}"

          echo "Current image: $CURRENT_IMAGE"
          echo "New image:     $NEW_IMAGE"

          echo "Pulling new image..."
          docker pull "$NEW_IMAGE"

          echo "Deploying new image..."
          export RWL_IMAGE="$NEW_IMAGE"

          docker compose \
            -p rwl_crm \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            up -d

          echo "Waiting for DEV..."

          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "DEV smoke test passed"
              echo "Deployment successful: $NEW_IMAGE"
              exit 0
            fi

            echo "Waiting for DEV... attempt $i/10"
            sleep 3
          done

          echo "DEV smoke test FAILED"
          echo "Rolling back to: $CURRENT_IMAGE"

          export RWL_IMAGE="$CURRENT_IMAGE"

          docker pull "$CURRENT_IMAGE"

          docker compose \
            -p rwl_crm \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            up -d

          echo "Waiting for rollback..."

          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              echo "Rollback successful"
              echo "DEV restored to: $CURRENT_IMAGE"
              exit 1
            fi

            echo "Waiting for rollback... attempt $i/10"
            sleep 3
          done

          echo "ROLLBACK FAILED"
          echo "DEV requires manual intervention"
          exit 2

          REMOTE