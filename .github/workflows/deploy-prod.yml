name: Deploy PROD

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Prepare checks or deploy application"
        required: true
        type: choice
        default: prepare
        options:
          - prepare
          - deploy

permissions:
  contents: read

concurrency:
  group: rwl-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy PROD
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment request
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "Branch: $REF_NAME"
          echo "Mode: $MODE"

          if [[ "$MODE" == "deploy" && "$REF_NAME" != "master" ]]; then
            echo "ERROR: PROD deployment must be launched from master"
            exit 1
          fi

      - name: Prepare SSH
        shell: bash
        env:
          BASTION_KEY: ${{ secrets.BASTION_SSH_KEY }}
          DEV_KEY: ${{ secrets.DEV_SSH_KEY }}
          PROD_KEY: ${{ secrets.PROD_SSH_KEY }}

          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          BASTION_PORT: ${{ secrets.BASTION_PORT }}
          BASTION_USER: ${{ secrets.BASTION_USER }}

          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_PORT: ${{ secrets.DEV_PORT }}
          DEV_USER: ${{ secrets.DEV_USER }}

          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$BASTION_KEY" > ~/.ssh/bastion_key
          printf '%s\n' "$DEV_KEY" > ~/.ssh/dev_key
          printf '%s\n' "$PROD_KEY" > ~/.ssh/prod_key

          chmod 600 ~/.ssh/*_key

          cat > ~/.ssh/config <<EOF
          Host rwl-bastion
              HostName ${BASTION_HOST}
              Port ${BASTION_PORT}
              User ${BASTION_USER}
              IdentityFile ~/.ssh/bastion_key
              IdentitiesOnly yes
              BatchMode yes

          Host rwl-dev
              HostName ${DEV_HOST}
              Port ${DEV_PORT}
              User ${DEV_USER}
              IdentityFile ~/.ssh/dev_key
              IdentitiesOnly yes
              BatchMode yes
              ProxyJump rwl-bastion

          Host rwl-prod
              HostName ${PROD_HOST}
              Port ${PROD_PORT}
              User ${PROD_USER}
              IdentityFile ~/.ssh/prod_key
              IdentitiesOnly yes
              BatchMode yes
          EOF

          chmod 600 ~/.ssh/config

          # Bastion: non-standard SSH port
          printf '[%s]:%s ssh-ed25519 %s\n' \
            "$BASTION_HOST" "$BASTION_PORT" \
            'AAAAC3NzaC1lZDI1NTE5AAAAIBI/PGxBXZP7zArDTKQPwd58E2/ANnXvsXgf61TqfGXA' \
            > ~/.ssh/known_hosts

          # DEV: standard known_hosts entry
          printf '%s ssh-ed25519 %s\n' \
            "$DEV_HOST" \
            'AAAAC3NzaC1lZDI1NTE5AAAAIBnVi2TXGVUEBFbXaWnaZc6htfpOQL2EDeUAsjCNF/46' \
            >> ~/.ssh/known_hosts

          # PROD: SSH port 22
          printf '%s ssh-ed25519 %s\n' \
            "$PROD_HOST" \
            'AAAAC3NzaC1lZDI1NTE5AAAAIAV8uca3Sm3G4PbDEkkj77DiObNFZ3pbbWEUxrvyocHE' \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      - name: Read running DEV image
        id: dev
        shell: bash
        run: |
          set -euo pipefail

          IMAGE=$(ssh rwl-dev \
            "docker inspect --format '{{.Config.Image}}' rwl_crm-web-1")

          case "$IMAGE" in
            ghcr.io/urffin-juss/rwl_crm:*) ;;
            *)
              echo "ERROR: Unexpected DEV image: $IMAGE"
              exit 1
              ;;
          esac

          echo "Running DEV image: $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Check PROD readiness
        shell: bash
        env:
          NEW_IMAGE: ${{ steps.dev.outputs.image }}
        run: |
          set -euo pipefail

          ssh rwl-prod \
            "NEW_IMAGE='$NEW_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/crm/rwl_crm

          echo "================================"
          echo "Current PROD image:"
          docker inspect --format '{{.Config.Image}}' rwl_crm-web-1

          echo "================================"
          echo "Target DEV image:"
          echo "$NEW_IMAGE"

          echo "================================"
          echo "Checking Docker Compose..."
          docker compose config --quiet

          echo "================================"
          echo "Checking GHCR manifest..."
          docker manifest inspect "$NEW_IMAGE" > /dev/null

          echo "================================"
          echo "Checking application containers..."
          docker compose ps web bot celery_worker celery_beat

          echo "================================"
          echo "PROD readiness checks passed"
          REMOTE

      - name: Deploy application
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          NEW_IMAGE: ${{ steps.dev.outputs.image }}
        run: |
          set -euo pipefail

          ssh rwl-prod \
            "NEW_IMAGE='$NEW_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/crm/rwl_crm

          OLD_IMAGE=$(docker inspect --format '{{.Config.Image}}' rwl_crm-web-1)
          
          
          rollback() {
            echo "================================"
            echo "Deployment failed. Starting rollback..."
            echo "Restoring image: $OLD_IMAGE"
          
            trap - ERR
          
            export RWL_IMAGE="$OLD_IMAGE"
          
            if docker compose -p rwl_crm up -d \
              --no-deps \
              web celery_worker celery_beat bot; then
          
              echo "Previous containers restored."
            else
              echo "CRITICAL: Automatic rollback failed!"
            fi
          
            echo "WARNING: Database migrations are NOT rolled back."
            exit 1
          }
          
          trap rollback ERR

          echo "================================"
          echo "Previous image: $OLD_IMAGE"
          echo "New image:      $NEW_IMAGE"

          echo "================================"
          echo "Pulling application image..."
          docker pull "$NEW_IMAGE"

          echo "================================"
          echo "Updating application containers..."

          export RWL_IMAGE="$NEW_IMAGE"

          docker compose -p rwl_crm up -d \
            --no-deps \
            web celery_worker celery_beat bot

          echo "================================"
          echo "Checking container states..."

          for SERVICE in web celery_worker celery_beat bot; do
            CONTAINER_ID=$(docker compose -p rwl_crm ps -q "$SERVICE")

            if [[ -z "$CONTAINER_ID" ]]; then
              echo "ERROR: Container not found: $SERVICE"
              exit 1
            fi

            STATE=$(docker inspect \
              --format '{{.State.Status}}' "$CONTAINER_ID")

            echo "$SERVICE: $STATE"

            if [[ "$STATE" != "running" ]]; then
              echo "ERROR: $SERVICE is not running"
              HEALTHY=0
              break
            fi
          done

          echo "================================"
          echo "Waiting for Django..."

          HEALTHY=0

          for i in {1..20}; do
            if curl -fsS \
              --resolve runwithlove.site:443:127.0.0.1 \
              https://runwithlove.site/calendar \
              > /dev/null; then

              HEALTHY=1
              break
            fi

            sleep 3
          done

          if [[ "$HEALTHY" -ne 1 ]]; then
            echo "================================"
            echo "Smoke test failed."
            echo "Restoring previous application image..."

            export RWL_IMAGE="$OLD_IMAGE"

            docker compose -p rwl_crm up -d \
              --no-deps \
              web celery_worker celery_beat bot

            echo "Application rollback attempted."
            echo "WARNING: Database migrations are NOT rolled back."

            exit 1
          fi

          echo "================================"
          echo "Saving deployed image..."

          sed -i \
            "s|^RWL_IMAGE=.*|RWL_IMAGE=$NEW_IMAGE|" \
            .env

          echo "================================"
          echo "PROD deployment successful!"
          echo "Image: $NEW_IMAGE"
          REMOTE