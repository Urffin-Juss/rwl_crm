{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>



    <link
        rel="stylesheet"
        href="{% static 'webui/calendar.css' %}"
    >
</head>




<title>Календарь забегов</title>

<div id="calendar-app">

<div class="app">

    <div class="calendar-header">
        <button class="month-button prev-month">←</button>

        <h1 class="calendar-title"></h1>

        <button class="month-button next-month">→</button>
    </div>

    <div class="weekdays">
        <div>ПН</div>
        <div>ВТ</div>
        <div>СР</div>
        <div>ЧТ</div>
        <div>ПТ</div>
        <div>СБ</div>
        <div>ВС</div>
    </div>

    <div class="calendar-grid"></div>

    <div id="calendar-empty-state" class="calendar-empty-state">

    <div class="brand-content">

        <div class="brand-logo">

            <div class="brand-line">
                RUN
            </div>

            <div class="brand-line">
                WITH
            </div>

            <div class="brand-line brand-love">
                <span class="brand-letter">L</span>

                <span class="brand-heart">
                    <span class="brand-heart-shape">
                    </span>
                </span>

                <span class="brand-letter">VE</span>
            </div>

        </div>

        <div class="brand-slogan">
            Это всё по любви
        </div>

    </div>

</div>

    <section class="events-panel hidden">

        <h2 class="events-date"></h2>

        <div class="event-carousel">

            <button class="carousel-button event-prev">
                ←
            </button>

            <div class="event-card-container"></div>



            <button class="carousel-button event-next">
                →
            </button>

        </div>


        <div class="event-counter"></div>

    </section>

</div>

</div>



<div id="consent-gate" class="consent-gate" style="display: none;">
    <div class="consent-card">
        <div class="consent-progress" id="consent-progress"></div>

        <h2 id="consent-title"></h2>

        <p id="consent-version"></p>

        <a
            id="consent-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            Открыть документ
        </a>

        <button id="consent-accept-button" type="button">
            Согласен
        </button>
    </div>
</div>

<script src="{% static 'webui/calendar.js' %}"></script>

</body>
</html>
