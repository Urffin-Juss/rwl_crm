services:
  web:
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app

  celery_worker:
    volumes:
      - .:/app
      - media_data:/app/media

  celery_beat:
    volumes:
      - .:/app

  nginx:
    profiles:
      - nginx