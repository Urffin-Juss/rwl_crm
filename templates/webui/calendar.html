<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Календарь забегов</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .calendar-app {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ========================================================
           ШАПКА КАЛЕНДАРЯ
           ======================================================== */

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .calendar-title {
            margin: 0;
            font-size: 24px;
            text-align: center;
        }

        .calendar-header button {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 50%;

            font-size: 20px;
            cursor: pointer;
        }

        /* ========================================================
           ДНИ НЕДЕЛИ
           ======================================================== */

        .weekdays,
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .weekdays {
            margin-bottom: 10px;

            text-align: center;
            color: #999;
            font-size: 13px;
        }

        /* ========================================================
           КАЛЕНДАРЬ
           ======================================================== */

        .calendar-grid {
            text-align: center;
        }

        .calendar-day {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto;

            border-radius: 50%;

            font-size: 16px;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .calendar-day.has-event {
            background: #e53935;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        .calendar-day.has-event:hover {
            transform: scale(1.08);
        }

        /*
           Выбранная дата чуть выделяется.
           Позже можно поиграть с дизайном.
        */

        .calendar-day.selected {
            outline: 3px solid rgba(255, 255, 255, 0.75);
            outline-offset: 3px;
        }

        /* ========================================================
           ПАНЕЛЬ СОБЫТИЙ
           ======================================================== */

        .events-panel {
            margin-top: 30px;
        }

        /*
           Пока дата не выбрана —
           панель вообще не занимает место.
        */

        .events-panel.hidden {
            display: none;
        }

        .events-date {
            margin: 0 0 18px;

            font-size: 20px;
        }

        /* ========================================================
           КАРУСЕЛЬ
           ======================================================== */

        .event-carousel {
            display: grid;

            /*
               слева стрелка
               по центру карточка
               справа стрелка
            */

            grid-template-columns: 44px minmax(0, 1fr) 44px;

            align-items: center;
            gap: 10px;
        }

        .event-carousel.single-event {
            /*
               Если забег один —
               карточка занимает всё место.
            */

            grid-template-columns: 1fr;
        }

        /* ========================================================
           СТРЕЛКИ КАРУСЕЛИ
           ======================================================== */

        .event-arrow {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 50%;

            background: #eee;
            color: #111;

            font-size: 22px;

            cursor: pointer;

            transition: transform 0.15s ease;
        }

        .event-arrow:hover {
            transform: scale(1.08);
        }

        .event-arrow.hidden {
            display: none;
        }

        /* ========================================================
           КАРТОЧКА ЗАБЕГА
           ======================================================== */

        .event-card {
            width: 100%;

            background: #222;

            border-radius: 18px;

            padding: 18px;
        }

        .event-card h3 {
            margin: 0 0 8px;

            font-size: 18px;
        }

        .event-city {
            margin: 0 0 14px;

            color: #aaa;
        }

        /* ========================================================
           ДИСТАНЦИИ
           ======================================================== */

        .event-distances {
            display: flex;
            flex-wrap: wrap;

            gap: 7px;
        }

        .distance-badge {
            padding: 6px 10px;

            background: #333;

            border-radius: 9px;

            font-size: 13px;
        }

        /* ========================================================
           СЧЁТЧИК 1 / 3
           ======================================================== */

        .event-counter {
            margin-top: 12px;

            text-align: center;

            color: #888;

            font-size: 13px;
        }

        .event-counter.hidden {
            display: none;
        }

        /* ========================================================
           НЕМНОГО АДАПТИВА ПОД УЗКИЙ ЭКРАН
           ======================================================== */

        @media (max-width: 420px) {

            .calendar-app {
                padding: 16px;
            }

            .calendar-title {
                font-size: 21px;
            }

            .calendar-day {
                width: 38px;
                height: 38px;
            }

            .event-carousel {
                grid-template-columns: 38px minmax(0, 1fr) 38px;
                gap: 6px;
            }

            .event-arrow {
                width: 38px;
                height: 38px;
            }

            .event-card {
                padding: 15px;
            }

        }
    </style>
</head>


<body>

<main class="calendar-app">

    <!-- =========================================================
         КАЛЕНДАРЬ
         ========================================================= -->

    <header class="calendar-header">

        <button
            type="button"
            class="prev-month"
            aria-label="Предыдущий месяц"
        >
            ←
        </button>

        <h1 class="calendar-title"></h1>

        <button
            type="button"
            class="next-month"
            aria-label="Следующий месяц"
        >
            →
        </button>

    </header>


    <div class="weekdays">
        <div>Пн</div>
        <div>Вт</div>
        <div>Ср</div>
        <div>Чт</div>
        <div>Пт</div>
        <div>Сб</div>
        <div>Вс</div>
    </div>


    <div class="calendar-grid"></div>


    <!-- =========================================================
         СОБЫТИЯ ВЫБРАННОГО ДНЯ
         ========================================================= -->

    <section class="events-panel hidden">

        <h2 class="events-date"></h2>


        <div class="event-carousel">

            <!-- Предыдущий забег -->

            <button
                type="button"
                class="event-arrow event-prev"
                aria-label="Предыдущий забег"
            >
                ←
            </button>


            <!--
                Здесь будет находиться
                ОДНА текущая карточка.
            -->

            <div class="event-card-container"></div>


            <!-- Следующий забег -->

            <button
                type="button"
                class="event-arrow event-next"
                aria-label="Следующий забег"
            >
                →
            </button>

        </div>


        <!-- Например: 2 / 5 -->

        <div class="event-counter"></div>

    </section>

</main>


<script>

    /* ============================================================
       ЭЛЕМЕНТЫ СТРАНИЦЫ
       ============================================================ */

    const calendarGrid =
        document.querySelector('.calendar-grid');

    const calendarTitle =
        document.querySelector('.calendar-title');

    const prevMonthButton =
        document.querySelector('.prev-month');

    const nextMonthButton =
        document.querySelector('.next-month');


    const eventsPanel =
        document.querySelector('.events-panel');

    const eventsDate =
        document.querySelector('.events-date');

    const eventCarousel =
        document.querySelector('.event-carousel');

    const eventCardContainer =
        document.querySelector('.event-card-container');

    const eventPrevButton =
        document.querySelector('.event-prev');

    const eventNextButton =
        document.querySelector('.event-next');

    const eventCounter =
        document.querySelector('.event-counter');


    /* ============================================================
       СОСТОЯНИЕ ПРИЛОЖЕНИЯ
       ============================================================ */

    /*
       Открываем календарь на текущем месяце.
    */

    const today = new Date();

    let currentYear =
        today.getFullYear();

    let currentMonth =
        today.getMonth();


    /*
       Все события, которые пришли
       от Django API.
    */

    let events = [];


    /*
       События конкретного выбранного дня.

       Например:

       [
           забег №1,
           забег №2,
           забег №3
       ]
    */

    let selectedDayEvents = [];


    /*
       Какой забег из выбранного дня
       сейчас показываем.

       Важно:

       массивы в JS начинаются с 0.

       Поэтому:

       0 = первый забег
       1 = второй
       2 = третий
    */

    let currentEventIndex = 0;


    /* ============================================================
       МЕСЯЦЫ
       ============================================================ */

    const monthNames = [
        'Январь',
        'Февраль',
        'Март',
        'Апрель',
        'Май',
        'Июнь',
        'Июль',
        'Август',
        'Сентябрь',
        'Октябрь',
        'Ноябрь',
        'Декабрь'
    ];


    const monthNamesGenitive = [
        'января',
        'февраля',
        'марта',
        'апреля',
        'мая',
        'июня',
        'июля',
        'августа',
        'сентября',
        'октября',
        'ноября',
        'декабря'
    ];


    /* ============================================================
       ЗАГРУЗКА СОБЫТИЙ
       ============================================================ */

    async function loadEvents() {

        try {

            const response =
                await fetch('/api/events/');


            if (!response.ok) {

                throw new Error(
                    `Ошибка API: ${response.status}`
                );

            }


            events =
                await response.json();


            console.log(
                'События загружены:',
                events
            );


            renderCalendar();

        }

        catch (error) {

            console.error(
                'Не удалось загрузить события:',
                error
            );

        }

    }


    /* ============================================================
       РИСУЕМ КАЛЕНДАРЬ
       ============================================================ */

    function renderCalendar() {

        calendarGrid.innerHTML = '';


        calendarTitle.textContent =
            `${monthNames[currentMonth]} ${currentYear}`;


        const firstDay =
            new Date(
                currentYear,
                currentMonth,
                1
            );


        const lastDay =
            new Date(
                currentYear,
                currentMonth + 1,
                0
            );


        const daysInMonth =
            lastDay.getDate();


        /*
           Переводим неделю JavaScript
           в привычную нам:

           Пн → Вс
        */

        let startDay =
            firstDay.getDay();

        startDay =
            (startDay + 6) % 7;


        /* ========================================================
           ПУСТЫЕ КЛЕТКИ
           ======================================================== */

        for (
            let i = 0;
            i < startDay;
            i++
        ) {

            const emptyCell =
                document.createElement('div');


            calendarGrid.appendChild(
                emptyCell
            );

        }


        /* ========================================================
           ДНИ МЕСЯЦА
           ======================================================== */

        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const dayCell =
                document.createElement('div');


            dayCell.textContent =
                day;


            dayCell.classList.add(
                'calendar-day'
            );


            /*
               Получаем:

               2026-08-30
            */

            const currentDate =
                `${currentYear}-` +
                `${String(currentMonth + 1).padStart(2, '0')}-` +
                `${String(day).padStart(2, '0')}`;


            /*
               Находим ВСЕ забеги
               этой даты.
            */

            const dayEvents =
                events.filter(
                    event =>
                        event.date === currentDate
                );


            /*
               Если забеги есть —
               делаем дату активной.
            */

            if (dayEvents.length > 0) {

                dayCell.classList.add(
                    'has-event'
                );


                dayCell.addEventListener(
                    'click',
                    function () {

                        /*
                           Снимаем выделение
                           с предыдущей даты.
                        */

                        document
                            .querySelectorAll('.calendar-day.selected')
                            .forEach(
                                element =>
                                    element.classList.remove('selected')
                            );


                        /*
                           Выделяем новую дату.
                        */

                        dayCell.classList.add(
                            'selected'
                        );


                        /*
                           Сохраняем события
                           выбранного дня.
                        */

                        selectedDayEvents =
                            dayEvents;


                        /*
                           При выборе новой даты
                           всегда начинаем
                           с первого забега.
                        */

                        currentEventIndex = 0;


                        /*
                           Показываем панель.
                        */

                        eventsPanel.classList.remove(
                            'hidden'
                        );


                        /*
                           Пишем красивую дату.
                        */

                        eventsDate.textContent =
                            `${day} ` +
                            `${monthNamesGenitive[currentMonth]} ` +
                            `${currentYear}`;


                        /*
                           Рисуем первый забег.
                        */

                        renderCurrentEvent();

                    }
                );

            }


            calendarGrid.appendChild(
                dayCell
            );

        }

    }


    /* ============================================================
       РИСУЕМ ТЕКУЩИЙ ЗАБЕГ
       ============================================================ */

    function renderCurrentEvent() {

        /*
           Защита на случай,
           если событий нет.
        */

        if (selectedDayEvents.length === 0) {
            return;
        }


        /*
           Берём только ОДНО событие
           по текущему индексу.
        */

        const event =
            selectedDayEvents[currentEventIndex];


        /*
           Полностью очищаем
           предыдущую карточку.
        */

        eventCardContainer.innerHTML = '';


        /* ========================================================
           СОЗДАЁМ КАРТОЧКУ
           ======================================================== */

        const card =
            document.createElement('article');


        card.classList.add(
            'event-card'
        );


        /* -------------------------
           Название
           ------------------------- */

        const title =
            document.createElement('h3');


        title.textContent =
            event.name;


        /* -------------------------
           Город
           ------------------------- */

        const city =
            document.createElement('p');


        city.classList.add(
            'event-city'
        );


        city.textContent =
            event.city;


        /* -------------------------
           Дистанции
           ------------------------- */

        const distances =
            document.createElement('div');


        distances.classList.add(
            'event-distances'
        );


        if (
            event.distances &&
            event.distances.length > 0
        ) {

            event.distances.forEach(
                function (distance) {

                    const badge =
                        document.createElement('span');


                    badge.classList.add(
                        'distance-badge'
                    );


                    badge.textContent =
                        distance.name;


                    distances.appendChild(
                        badge
                    );

                }
            );

        }


        /* -------------------------
           Собираем карточку
           ------------------------- */

        card.appendChild(title);

        card.appendChild(city);

        card.appendChild(distances);


        eventCardContainer.appendChild(
            card
        );


        /* ========================================================
           СТРЕЛКИ И СЧЁТЧИК
           ======================================================== */

        updateCarouselControls();

    }


    /* ============================================================
       УПРАВЛЕНИЕ КАРУСЕЛЬЮ
       ============================================================ */

    function updateCarouselControls() {

        /*
           Если забег всего один —
           стрелки и счётчик не нужны.
        */

        if (selectedDayEvents.length <= 1) {

            eventPrevButton.classList.add(
                'hidden'
            );

            eventNextButton.classList.add(
                'hidden'
            );

            eventCounter.classList.add(
                'hidden'
            );

            eventCarousel.classList.add(
                'single-event'
            );

            return;

        }


        /*
           Если забегов несколько —
           всё показываем.
        */

        eventPrevButton.classList.remove(
            'hidden'
        );

        eventNextButton.classList.remove(
            'hidden'
        );

        eventCounter.classList.remove(
            'hidden'
        );

        eventCarousel.classList.remove(
            'single-event'
        );


        /*
           Пользователю показываем:

           1 / 3

           а не:

           0 / 3
        */

        eventCounter.textContent =
            `${currentEventIndex + 1} / ${selectedDayEvents.length}`;

    }


    /* ============================================================
       ПРЕДЫДУЩИЙ ЗАБЕГ
       ============================================================ */

    eventPrevButton.addEventListener(
        'click',
        function () {

            currentEventIndex--;


            /*
               Если находились на первом,
               перескакиваем на последний.
            */

            if (currentEventIndex < 0) {

                currentEventIndex =
                    selectedDayEvents.length - 1;

            }


            renderCurrentEvent();

        }
    );


    /* ============================================================
       СЛЕДУЮЩИЙ ЗАБЕГ
       ============================================================ */

    eventNextButton.addEventListener(
        'click',
        function () {

            currentEventIndex++;


            /*
               Если прошли последний —
               возвращаемся к первому.
            */

            if (
                currentEventIndex >=
                selectedDayEvents.length
            ) {

                currentEventIndex = 0;

            }


            renderCurrentEvent();

        }
    );


    /* ============================================================
       ПРЕДЫДУЩИЙ МЕСЯЦ
       ============================================================ */

    prevMonthButton.addEventListener(
        'click',
        function () {

            currentMonth--;


            if (currentMonth < 0) {

                currentMonth = 11;

                currentYear--;

            }


            closeEventsPanel();

            renderCalendar();

        }
    );


    /* ============================================================
       СЛЕДУЮЩИЙ МЕСЯЦ
       ============================================================ */

    nextMonthButton.addEventListener(
        'click',
        function () {

            currentMonth++;


            if (currentMonth > 11) {

                currentMonth = 0;

                currentYear++;

            }


            closeEventsPanel();

            renderCalendar();

        }
    );


    /* ============================================================
       ЗАКРЫВАЕМ ПАНЕЛЬ СОБЫТИЙ
       ============================================================ */

    function closeEventsPanel() {

        eventsPanel.classList.add(
            'hidden'
        );


        selectedDayEvents = [];

        currentEventIndex = 0;


        eventCardContainer.innerHTML = '';

        eventsDate.textContent = '';

        eventCounter.textContent = '';

    }


    /* ============================================================
       ЗАПУСК
       ============================================================ */

    loadEvents();

</script>

</body>
</html>
