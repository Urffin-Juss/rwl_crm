<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Календарь забегов</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .calendar-app {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .calendar-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .calendar-header button {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }

        .weekdays,
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .weekdays {
            margin-bottom: 10px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }

        .calendar-grid {
            text-align: center;
        }

        .calendar-day {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto;

            border-radius: 50%;
            font-size: 16px;
        }

        .calendar-day.has-event {
            background: #e53935;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<main class="calendar-app">

    <header class="calendar-header">
        <button type="button" class="prev-month">←</button>

        <h1 class="calendar-title">Август 2026</h1>

        <button type="button" class="next-month">→</button>
    </header>


    <div class="weekdays">
        <div>Пн</div>
        <div>Вт</div>
        <div>Ср</div>
        <div>Чт</div>
        <div>Пт</div>
        <div>Сб</div>
        <div>Вс</div>
    </div>


    <div class="calendar-grid"></div>

</main>


<script>
    const calendarGrid = document.querySelector('.calendar-grid');
    const calendarTitle = document.querySelector('.calendar-title');

    const prevButton = document.querySelector('.prev-month');
    const nextButton = document.querySelector('.next-month');


    let currentYear = 2026;
    let currentMonth = 7;

    let events = [];


    const monthNames = [
        'Январь',
        'Февраль',
        'Март',
        'Апрель',
        'Май',
        'Июнь',
        'Июль',
        'Август',
        'Сентябрь',
        'Октябрь',
        'Ноябрь',
        'Декабрь'
    ];


    async function loadEvents() {
        const response = await fetch('/api/events/');

        events = await response.json();

        console.log(events);

        renderCalendar();
    }


    function renderCalendar() {
        calendarGrid.innerHTML = '';

        calendarTitle.textContent =
            `${monthNames[currentMonth]} ${currentYear}`;


        const firstDay = new Date(
            currentYear,
            currentMonth,
            1
        );


        const lastDay = new Date(
            currentYear,
            currentMonth + 1,
            0
        );


        const daysInMonth = lastDay.getDate();

        let startDay = firstDay.getDay();


        /*
            JavaScript считает:

            воскресенье = 0
            понедельник = 1
            ...
            суббота = 6

            А нам нужно:

            понедельник = 0
            ...
            воскресенье = 6
        */

        startDay = (startDay + 6) % 7;


        /*
            Добавляем пустые клетки
            перед первым числом месяца
        */

        for (let i = 0; i < startDay; i++) {
            const emptyCell = document.createElement('div');

            calendarGrid.appendChild(emptyCell);
        }


        /*
            Рисуем сами дни месяца
        */

        for (let day = 1; day <= daysInMonth; day++) {

            const dayCell = document.createElement('div');

            dayCell.textContent = day;

            dayCell.classList.add('calendar-day');


            /*
                Собираем дату вида:

                2026-08-30
            */

            const currentDate =
                `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;


            /*
                Ищем все забеги,
                которые проходят в этот день
            */

            const dayEvents = events.filter(
                event => event.date === currentDate
            );


            /*
                Если хотя бы один забег найден —
                помечаем день
            */

            if (dayEvents.length > 0) {
                dayCell.classList.add('has-event');
            }


            calendarGrid.appendChild(dayCell);
        }
    }


    /*
        Предыдущий месяц
    */

    prevButton.addEventListener('click', function () {

        currentMonth--;

        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }

        renderCalendar();
    });


    /*
        Следующий месяц
    */

    nextButton.addEventListener('click', function () {

        currentMonth++;

        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }

        renderCalendar();
    });


    /*
        Загружаем события
        после открытия страницы
    */

    loadEvents();

</script>

</body>
</html>
