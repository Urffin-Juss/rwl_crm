<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Календарь забегов</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .calendar-app {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .calendar-title {
            margin: 0;
            font-size: 24px;
            text-align: center;
        }

        .calendar-header button {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }

        .weekdays,
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .weekdays {
            margin-bottom: 10px;
            text-align: center;
            color: #999;
            font-size: 13px;
        }

        .calendar-grid {
            text-align: center;
        }

        .calendar-day {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto;

            border-radius: 50%;
            font-size: 16px;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .calendar-day.has-event {
            background: #e53935;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .calendar-day.has-event:hover {
            transform: scale(1.08);
        }

        .calendar-day.selected {
            outline: 3px solid rgba(255, 255, 255, 0.75);
            outline-offset: 3px;
        }

        .events-panel {
            margin-top: 30px;
        }

        .events-panel.hidden {
            display: none;
        }

        .events-date {
            margin: 0 0 18px;
            font-size: 20px;
        }

        .event-carousel {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr) 44px;
            align-items: center;
            gap: 10px;
        }

        .event-carousel.single-event {
            grid-template-columns: 1fr;
        }

        .event-arrow {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 50%;

            background: #eee;
            color: #111;

            font-size: 22px;
            cursor: pointer;

            transition: transform 0.15s ease;
        }

        .event-arrow:hover {
            transform: scale(1.08);
        }

        .event-arrow.hidden {
            display: none;
        }

        .event-card {
            width: 100%;
            background: #222;
            border-radius: 18px;
            padding: 18px;
        }

        .event-card h3 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .event-city {
            margin: 0 0 14px;
            color: #aaa;
        }

        .event-distances {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 16px;
        }

        .distance-badge {
            padding: 6px 10px;
            background: #333;
            border-radius: 9px;
            font-size: 13px;
        }

        .event-social {
            margin-top: 4px;
            padding-top: 14px;
            border-top: 1px solid #333;
        }

        .participants-count {
            margin: 0 0 12px;
            color: #ccc;
            font-size: 14px;
        }

        .join-button {
            width: 100%;
            padding: 12px 16px;

            border: none;
            border-radius: 12px;

            background: #e53935;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease,
                background 0.15s ease;
        }

        .join-button:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .join-button:active:not(:disabled) {
            transform: translateY(0);
            opacity: 0.9;
        }

        .join-button.joined {
            background: #3a3a3a;
            color: #ddd;
            cursor: default;
        }

        .join-button:disabled {
            opacity: 1;
        }

        .event-counter {
            margin-top: 12px;
            text-align: center;
            color: #888;
            font-size: 13px;
        }

        .event-counter.hidden {
            display: none;
        }

        @media (max-width: 420px) {

            .calendar-app {
                padding: 16px;
            }

            .calendar-title {
                font-size: 21px;
            }

            .calendar-day {
                width: 38px;
                height: 38px;
            }

            .event-carousel {
                grid-template-columns:
                    38px
                    minmax(0, 1fr)
                    38px;

                gap: 6px;
            }

            .event-arrow {
                width: 38px;
                height: 38px;
            }

            .event-card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<main class="calendar-app">

    <header class="calendar-header">

        <button
            type="button"
            class="prev-month"
            aria-label="Предыдущий месяц"
        >
            ←
        </button>

        <h1 class="calendar-title"></h1>

        <button
            type="button"
            class="next-month"
            aria-label="Следующий месяц"
        >
            →
        </button>

    </header>

    <div class="weekdays">
        <div>Пн</div>
        <div>Вт</div>
        <div>Ср</div>
        <div>Чт</div>
        <div>Пт</div>
        <div>Сб</div>
        <div>Вс</div>
    </div>

    <div class="calendar-grid"></div>

    <section class="events-panel hidden">

        <h2 class="events-date"></h2>

        <div class="event-carousel">

            <button
                type="button"
                class="event-arrow event-prev"
                aria-label="Предыдущий забег"
            >
                ←
            </button>

            <div class="event-card-container"></div>

            <button
                type="button"
                class="event-arrow event-next"
                aria-label="Следующий забег"
            >
                →
            </button>

        </div>

        <div class="event-counter"></div>

    </section>

</main>

<script>

    const calendarGrid =
        document.querySelector('.calendar-grid');

    const calendarTitle =
        document.querySelector('.calendar-title');

    const prevMonthButton =
        document.querySelector('.prev-month');

    const nextMonthButton =
        document.querySelector('.next-month');

    const eventsPanel =
        document.querySelector('.events-panel');

    const eventsDate =
        document.querySelector('.events-date');

    const eventCarousel =
        document.querySelector('.event-carousel');

    const eventCardContainer =
        document.querySelector('.event-card-container');

    const eventPrevButton =
        document.querySelector('.event-prev');

    const eventNextButton =
        document.querySelector('.event-next');

    const eventCounter =
        document.querySelector('.event-counter');


    const today =
        new Date();

    let currentYear =
        today.getFullYear();

    let currentMonth =
        today.getMonth();

    let events = [];

    let selectedDayEvents = [];

    let currentEventIndex = 0;


    /*
        Временный тестовый участник.

        Потом это заменим на реального
        ClubMember из Telegram Mini App.
    */

    const testMemberId = 2;


    const monthNames = [
        'Январь',
        'Февраль',
        'Март',
        'Апрель',
        'Май',
        'Июнь',
        'Июль',
        'Август',
        'Сентябрь',
        'Октябрь',
        'Ноябрь',
        'Декабрь'
    ];


    const monthNamesGenitive = [
        'января',
        'февраля',
        'марта',
        'апреля',
        'мая',
        'июня',
        'июля',
        'августа',
        'сентября',
        'октября',
        'ноября',
        'декабря'
    ];


    async function loadEvents() {

        try {

            const response =
                await fetch(`/api/events/?member=${testMemberId}`);


            if (!response.ok) {
                throw new Error(
                    `Ошибка API: ${response.status}`
                );
            }


            events =
                await response.json();


            console.log(
                'События загружены:',
                events
            );


            /*
                Для каждого event заведём
                локальный флаг.

                Пока браузер не знает,
                участвует ли именно member 2.

                Поэтому по умолчанию false.
            */




            renderCalendar();

        }

        catch (error) {

            console.error(
                'Не удалось загрузить события:',
                error
            );

        }

    }


    async function joinEvent(event) {

        /*
            Не даём отправить запрос повторно,
            если в интерфейсе уже знаем,
            что человек участвует.
        */

        if (event.current_member_joined) {
            return;
        }


        try {

            const response =
                await fetch(
                    '/api/participations/',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json',
                        },

                        body: JSON.stringify({
                            event: event.id,
                            member: testMemberId,
                            distance: null,
                            status: 'GOING',
                            looking_for_company: false
                        })
                    }
                );


            /*
                Успех:
                participation создана.
            */

            if (response.ok) {

                const participation =
                    await response.json();


                console.log(
                    'Участие создано:',
                    participation
                );


                event.current_member_joined = true;


                /*
                    Увеличиваем локальный счётчик,
                    чтобы не перезагружать API.
                */

                event.participants_count =
                    (event.participants_count ?? 0) + 1;


                renderCurrentEvent();

                return;
            }


            /*
                400 сейчас означает,
                что такую participation
                создать нельзя.

                В нашем тестовом сценарии
                наиболее вероятная причина —
                member уже записан.
            */

            if (response.status === 400) {

                const errorData =
                    await response.json();


                console.log(
                    'Participation уже существует или данные невалидны:',
                    errorData
                );


                /*
                    Счётчик НЕ увеличиваем.

                    Запись уже существовала
                    в базе до этого клика.
                */

                event.current_member_joined = true;


                renderCurrentEvent();

                return;
            }


            /*
                Любая другая ошибка.
            */

            const errorData =
                await response.json();


            console.error(
                'Ошибка участия:',
                errorData
            );

        }

        catch (error) {

            console.error(
                'Ошибка запроса участия:',
                error
            );

        }

    }


    function renderCalendar() {

        calendarGrid.innerHTML = '';


        calendarTitle.textContent =
            `${monthNames[currentMonth]} ${currentYear}`;


        const firstDay =
            new Date(
                currentYear,
                currentMonth,
                1
            );


        const lastDay =
            new Date(
                currentYear,
                currentMonth + 1,
                0
            );


        const daysInMonth =
            lastDay.getDate();


        let startDay =
            firstDay.getDay();


        startDay =
            (startDay + 6) % 7;


        for (
            let i = 0;
            i < startDay;
            i++
        ) {

            const emptyCell =
                document.createElement('div');


            calendarGrid.appendChild(
                emptyCell
            );

        }


        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const dayCell =
                document.createElement('div');


            dayCell.textContent =
                day;


            dayCell.classList.add(
                'calendar-day'
            );


            const currentDate =
                `${currentYear}-` +
                `${String(currentMonth + 1).padStart(2, '0')}-` +
                `${String(day).padStart(2, '0')}`;


            const dayEvents =
                events.filter(
                    event =>
                        event.date === currentDate
                );


            if (dayEvents.length > 0) {

                dayCell.classList.add(
                    'has-event'
                );


                dayCell.addEventListener(
                    'click',
                    function () {

                        document
                            .querySelectorAll('.calendar-day.selected')
                            .forEach(
                                element =>
                                    element.classList.remove('selected')
                            );


                        dayCell.classList.add(
                            'selected'
                        );


                        selectedDayEvents =
                            dayEvents;


                        currentEventIndex = 0;


                        eventsPanel.classList.remove(
                            'hidden'
                        );


                        eventsDate.textContent =
                            `${day} ` +
                            `${monthNamesGenitive[currentMonth]} ` +
                            `${currentYear}`;


                        renderCurrentEvent();

                    }
                );

            }


            calendarGrid.appendChild(
                dayCell
            );

        }

    }


    function renderCurrentEvent() {

        if (selectedDayEvents.length === 0) {
            return;
        }


        const event =
            selectedDayEvents[currentEventIndex];


        eventCardContainer.innerHTML = '';


        const card =
            document.createElement('article');


        card.classList.add(
            'event-card'
        );


        const title =
            document.createElement('h3');


        title.textContent =
            event.name;


        const city =
            document.createElement('p');


        city.classList.add(
            'event-city'
        );


        city.textContent =
            event.city;


        const distances =
            document.createElement('div');


        distances.classList.add(
            'event-distances'
        );


        if (
            event.distances &&
            event.distances.length > 0
        ) {

            event.distances.forEach(
                function (distance) {

                    const badge =
                        document.createElement('span');


                    badge.classList.add(
                        'distance-badge'
                    );


                    badge.textContent =
                        distance.name;


                    distances.appendChild(
                        badge
                    );

                }
            );

        }


        const socialBlock =
            document.createElement('div');


        socialBlock.classList.add(
            'event-social'
        );


        const participantsCount =
            document.createElement('p');


        participantsCount.classList.add(
            'participants-count'
        );


        const count =
            event.participants_count ?? 0;


        participantsCount.textContent =
            `👥 Участвуют: ${count}`;


        const joinButton =
            document.createElement('button');


        joinButton.type =
            'button';


        joinButton.classList.add(
            'join-button'
        );


        /*
            Если мы уже знаем,
            что текущий member участвует,
            показываем другое состояние.
        */

        if (event.current_member_joined) {

            joinButton.textContent =
                'Вы участвуете ✓';


            joinButton.classList.add(
                'joined'
            );


            joinButton.disabled =
                true;

        }

        else {

            joinButton.textContent =
                'Я участвую';


            joinButton.addEventListener(
                'click',
                function () {

                    joinEvent(event);

                }
            );

        }


        socialBlock.appendChild(
            participantsCount
        );


        socialBlock.appendChild(
            joinButton
        );


        card.appendChild(
            title
        );


        card.appendChild(
            city
        );


        card.appendChild(
            distances
        );


        card.appendChild(
            socialBlock
        );


        eventCardContainer.appendChild(
            card
        );


        updateCarouselControls();

    }


    function updateCarouselControls() {

        if (
            selectedDayEvents.length <= 1
        ) {

            eventPrevButton.classList.add(
                'hidden'
            );

            eventNextButton.classList.add(
                'hidden'
            );

            eventCounter.classList.add(
                'hidden'
            );

            eventCarousel.classList.add(
                'single-event'
            );

            return;

        }


        eventPrevButton.classList.remove(
            'hidden'
        );

        eventNextButton.classList.remove(
            'hidden'
        );

        eventCounter.classList.remove(
            'hidden'
        );

        eventCarousel.classList.remove(
            'single-event'
        );


        eventCounter.textContent =
            `${currentEventIndex + 1} / ${selectedDayEvents.length}`;

    }


    eventPrevButton.addEventListener(
        'click',
        function () {

            currentEventIndex--;


            if (currentEventIndex < 0) {

                currentEventIndex =
                    selectedDayEvents.length - 1;

            }


            renderCurrentEvent();

        }
    );


    eventNextButton.addEventListener(
        'click',
        function () {

            currentEventIndex++;


            if (
                currentEventIndex >=
                selectedDayEvents.length
            ) {

                currentEventIndex = 0;

            }


            renderCurrentEvent();

        }
    );


    prevMonthButton.addEventListener(
        'click',
        function () {

            currentMonth--;


            if (currentMonth < 0) {

                currentMonth = 11;
                currentYear--;

            }


            closeEventsPanel();

            renderCalendar();

        }
    );


    nextMonthButton.addEventListener(
        'click',
        function () {

            currentMonth++;


            if (currentMonth > 11) {

                currentMonth = 0;
                currentYear++;

            }


            closeEventsPanel();

            renderCalendar();

        }
    );


    function closeEventsPanel() {

        eventsPanel.classList.add(
            'hidden'
        );


        selectedDayEvents = [];

        currentEventIndex = 0;


        eventCardContainer.innerHTML = '';

        eventsDate.textContent = '';

        eventCounter.textContent = '';

    }


    loadEvents();

</script>

</body>
</html>
