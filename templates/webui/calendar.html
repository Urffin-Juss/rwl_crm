<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Календарь забегов</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .calendar-app {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        /* =========================
           Шапка календаря
           ========================= */

        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .calendar-title {
            margin: 0;
            font-size: 24px;
            text-align: center;
        }

        .calendar-header button {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 50%;

            font-size: 20px;
            cursor: pointer;
        }

        /* =========================
           Дни недели
           ========================= */

        .weekdays,
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .weekdays {
            margin-bottom: 10px;

            text-align: center;
            color: #999;
            font-size: 13px;
        }

        /* =========================
           Календарь
           ========================= */

        .calendar-grid {
            text-align: center;
        }

        .calendar-day {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto;

            border-radius: 50%;

            font-size: 16px;

            transition: transform 0.15s ease;
        }

        .calendar-day.has-event {
            background: #e53935;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .calendar-day.has-event:hover {
            transform: scale(1.08);
        }

        /* =========================
           Панель событий
           ========================= */

        .events-panel {
            margin-top: 30px;
        }

        .events-date {
            margin: 0 0 15px;

            font-size: 20px;
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* =========================
           Карточка забега
           ========================= */

        .event-card {
            background: #222;

            border-radius: 14px;

            padding: 16px;
        }

        .event-card h3 {
            margin: 0 0 8px;

            font-size: 18px;
        }

        .event-city {
            margin: 0 0 12px;

            color: #aaa;
        }

        /* =========================
           Дистанции
           ========================= */

        .event-distances {
            display: flex;
            flex-wrap: wrap;

            gap: 6px;
        }

        .distance-badge {
            padding: 5px 9px;

            background: #333;

            border-radius: 8px;

            font-size: 13px;
        }
    </style>
</head>


<body>

<main class="calendar-app">

    <!-- =========================
         Шапка
         ========================= -->

    <header class="calendar-header">

        <button
            type="button"
            class="prev-month"
            aria-label="Предыдущий месяц"
        >
            ←
        </button>

        <h1 class="calendar-title"></h1>

        <button
            type="button"
            class="next-month"
            aria-label="Следующий месяц"
        >
            →
        </button>

    </header>


    <!-- =========================
         Дни недели
         ========================= -->

    <div class="weekdays">
        <div>Пн</div>
        <div>Вт</div>
        <div>Ср</div>
        <div>Чт</div>
        <div>Пт</div>
        <div>Сб</div>
        <div>Вс</div>
    </div>


    <!-- Сюда JavaScript нарисует числа месяца -->

    <div class="calendar-grid"></div>


    <!-- =========================
         События выбранного дня
         ========================= -->

    <section class="events-panel">

        <h2 class="events-date"></h2>

        <div class="events-list"></div>

    </section>

</main>


<script>

    /* ============================================================
       Получаем элементы HTML
       ============================================================ */

    const calendarGrid =
        document.querySelector('.calendar-grid');

    const calendarTitle =
        document.querySelector('.calendar-title');

    const prevButton =
        document.querySelector('.prev-month');

    const nextButton =
        document.querySelector('.next-month');

    const eventsDate =
        document.querySelector('.events-date');

    const eventsList =
        document.querySelector('.events-list');


    /* ============================================================
       Текущий отображаемый месяц
       ============================================================ */

    const today = new Date();

    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();


    /* Здесь будут храниться события,
       полученные от Django API */

    let events = [];


    /* ============================================================
       Названия месяцев
       ============================================================ */

    const monthNames = [
        'Январь',
        'Февраль',
        'Март',
        'Апрель',
        'Май',
        'Июнь',
        'Июль',
        'Август',
        'Сентябрь',
        'Октябрь',
        'Ноябрь',
        'Декабрь'
    ];


    /*
       Отдельный массив нужен для красивой надписи:

       "30 августа 2026"

       вместо:

       "30 август 2026"
    */

    const monthNamesGenitive = [
        'января',
        'февраля',
        'марта',
        'апреля',
        'мая',
        'июня',
        'июля',
        'августа',
        'сентября',
        'октября',
        'ноября',
        'декабря'
    ];


    /* ============================================================
       Загружаем события из Django REST API
       ============================================================ */

    async function loadEvents() {

        try {

            const response = await fetch('/api/events/');

            if (!response.ok) {
                throw new Error(
                    `Ошибка API: ${response.status}`
                );
            }

            events = await response.json();

            console.log('События загружены:', events);

            renderCalendar();

        } catch (error) {

            console.error(
                'Не удалось загрузить события:',
                error
            );

        }

    }


    /* ============================================================
       Рисуем календарь
       ============================================================ */

    function renderCalendar() {

        /*
           Каждый раз очищаем старый месяц
        */

        calendarGrid.innerHTML = '';


        /*
           Меняем заголовок
        */

        calendarTitle.textContent =
            `${monthNames[currentMonth]} ${currentYear}`;


        /*
           Первый день месяца
        */

        const firstDay = new Date(
            currentYear,
            currentMonth,
            1
        );


        /*
           Нулевой день следующего месяца =
           последний день текущего месяца
        */

        const lastDay = new Date(
            currentYear,
            currentMonth + 1,
            0
        );


        const daysInMonth =
            lastDay.getDate();


        /*
           JavaScript:

           воскресенье = 0
           понедельник = 1
           ...
           суббота = 6

           Нам нужно:

           понедельник = 0
           ...
           воскресенье = 6
        */

        let startDay =
            firstDay.getDay();

        startDay =
            (startDay + 6) % 7;


        /* ========================================================
           Пустые клетки перед первым числом
           ======================================================== */

        for (
            let i = 0;
            i < startDay;
            i++
        ) {

            const emptyCell =
                document.createElement('div');

            calendarGrid.appendChild(
                emptyCell
            );

        }


        /* ========================================================
           Рисуем числа месяца
           ======================================================== */

        for (
            let day = 1;
            day <= daysInMonth;
            day++
        ) {

            const dayCell =
                document.createElement('div');


            dayCell.textContent = day;

            dayCell.classList.add(
                'calendar-day'
            );


            /*
               Собираем дату именно в том формате,
               который приходит от Django:

               2026-08-30
            */

            const currentDate =
                `${currentYear}-` +
                `${String(currentMonth + 1).padStart(2, '0')}-` +
                `${String(day).padStart(2, '0')}`;


            /*
               Ищем ВСЕ события этого дня.

               Результатом всегда будет массив.
            */

            const dayEvents =
                events.filter(
                    event =>
                        event.date === currentDate
                );


            /*
               Если события существуют —
               красим дату и разрешаем клик.
            */

            if (dayEvents.length > 0) {

                dayCell.classList.add(
                    'has-event'
                );


                dayCell.addEventListener(
                    'click',
                    function () {

                        renderEventCards(
                            dayEvents,
                            day
                        );

                    }
                );

            }


            calendarGrid.appendChild(
                dayCell
            );

        }

    }


    /* ============================================================
       Рисуем карточки событий выбранного дня
       ============================================================ */

    function renderEventCards(
        dayEvents,
        day
    ) {

        /*
           Заголовок:

           30 августа 2026
        */

        eventsDate.textContent =
            `${day} ` +
            `${monthNamesGenitive[currentMonth]} ` +
            `${currentYear}`;


        /*
           Удаляем карточки предыдущего выбранного дня
        */

        eventsList.innerHTML = '';


        /*
           Создаём отдельную карточку
           для КАЖДОГО события этого дня
        */

        dayEvents.forEach(
            function (event) {

                const card =
                    document.createElement('article');


                card.classList.add(
                    'event-card'
                );


                /* -------------------------
                   Название забега
                   ------------------------- */

                const title =
                    document.createElement('h3');

                title.textContent =
                    event.name;


                /* -------------------------
                   Город
                   ------------------------- */

                const city =
                    document.createElement('p');

                city.classList.add(
                    'event-city'
                );

                city.textContent =
                    event.city;


                /* -------------------------
                   Контейнер дистанций
                   ------------------------- */

                const distances =
                    document.createElement('div');

                distances.classList.add(
                    'event-distances'
                );


                /*
                   Если у события есть дистанции,
                   создаём для каждой маленький badge
                */

                if (
                    event.distances &&
                    event.distances.length > 0
                ) {

                    event.distances.forEach(
                        function (distance) {

                            const badge =
                                document.createElement('span');

                            badge.classList.add(
                                'distance-badge'
                            );


                            /*
                               Пока выводим название дистанции.

                               Например:

                               T20
                               5KM
                               10KM
                            */

                            badge.textContent =
                                distance.name;


                            distances.appendChild(
                                badge
                            );

                        }
                    );

                }


                /* -------------------------
                   Собираем карточку
                   ------------------------- */

                card.appendChild(title);
                card.appendChild(city);
                card.appendChild(distances);


                /* -------------------------
                   Добавляем её на страницу
                   ------------------------- */

                eventsList.appendChild(
                    card
                );

            }
        );

    }


    /* ============================================================
       Кнопка "предыдущий месяц"
       ============================================================ */

    prevButton.addEventListener(
        'click',
        function () {

            currentMonth--;


            /*
               Если ушли левее января —
               переходим в декабрь предыдущего года
            */

            if (currentMonth < 0) {

                currentMonth = 11;

                currentYear--;

            }


            /*
               При смене месяца убираем
               старые карточки
            */

            eventsDate.textContent = '';
            eventsList.innerHTML = '';


            renderCalendar();

        }
    );


    /* ============================================================
       Кнопка "следующий месяц"
       ============================================================ */

    nextButton.addEventListener(
        'click',
        function () {

            currentMonth++;


            /*
               Если ушли дальше декабря —
               переходим в январь следующего года
            */

            if (currentMonth > 11) {

                currentMonth = 0;

                currentYear++;

            }


            eventsDate.textContent = '';
            eventsList.innerHTML = '';


            renderCalendar();

        }
    );


    /* ============================================================
       Старт приложения
       ============================================================ */

    loadEvents();

</script>

</body>
</html>
