{% extends 'webui/base.html' %}

{% block title %}CRM Workspace{% endblock %}

{% block content %}
<section class="workspace-grid">
  <article class="metric-card red">
    <h2>CRM</h2>
    <p>Рабочая зона управления забегами, заказами и складом.</p>
    <a href="/admin/" class="ghost-btn">Админка</a>
  </article>

  <article class="metric-card">
    <h3>Профиль</h3>
    <p>{{ request.user.get_username }}</p>
    <p class="muted">Роли/права управляются группами в админке.</p>
  </article>

  <article class="metric-card">
    <h3>Быстрые переходы</h3>
    <div class="quick-links">
      <a href="/admin/">Админка</a>
    </div>
  </article>
</section>
{% endblock %}
